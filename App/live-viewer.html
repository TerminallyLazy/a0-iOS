<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'"><style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#picture{position:absolute;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-select:none;touch-action:pinch-zoom}body.control #picture{touch-action:none}
</style></head><body><img id="picture" alt="Remote host capture" draggable="false"><script>
const picture=document.getElementById('picture');let enabled=false,drag=false,start=null,pointers=new Map(),twoStart=null,pending=null,displayedFrame='';
window.receiveFrame = value => { enabled=value.enabled;drag=value.drag;document.body.classList.toggle('control',enabled);if(pointers.size){pending=value;return;}displayedFrame=value.frame;picture.src=value.image; };
function point(event){const r=picture.getBoundingClientRect(),ratio=picture.naturalWidth/picture.naturalHeight;let w=r.width,h=w/ratio;if(h>r.height){h=r.height;w=h*ratio;}const x=(event.clientX-r.left-(r.width-w)/2)/w,y=(event.clientY-r.top-(r.height-h)/2)/h;return Number.isFinite(x)&&Number.isFinite(y)&&x>=0&&x<=1&&y>=0&&y<=1?{x,y}:null;}
function send(value){if(enabled)window.webkit.messageHandlers.viewer.postMessage({...value,frame:displayedFrame});}
picture.addEventListener('pointerdown',event=>{if(!enabled)return;event.preventDefault();picture.setPointerCapture(event.pointerId);pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});if(pointers.size===2){twoStart=[...pointers.values()].reduce((a,p)=>({x:a.x+p.x/2,y:a.y+p.y/2}),{x:0,y:0});start=null;}else if(pointers.size===1)start=point(event);});
picture.addEventListener('pointermove',event=>{if(pointers.has(event.pointerId))pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});});
picture.addEventListener('pointerup',event=>{if(twoStart&&pointers.size===2){const end=[...pointers.values()].reduce((a,p)=>({x:a.x+p.x/2,y:a.y+p.y/2}),{x:0,y:0});send({kind:'scroll',dx:Math.max(-2000,Math.min(2000,(twoStart.x-end.x)*3)),dy:Math.max(-2000,Math.min(2000,(twoStart.y-end.y)*3))});twoStart=null;start=null;}else if(start&&pointers.size===1){const end=point(event);if(end){const distance=Math.hypot(end.x-start.x,end.y-start.y);if(distance<.02)send({kind:'click',...end});else if(drag)send({kind:'drag',...start,end_x:end.x,end_y:end.y});}start=null;}pointers.delete(event.pointerId);if(!pointers.size&&pending){const value=pending;pending=null;window.receiveFrame(value);}});
picture.addEventListener('pointercancel',()=>{pointers.clear();start=null;twoStart=null;pending=null;});
picture.addEventListener('wheel',event=>{if(!enabled)return;event.preventDefault();send({kind:'scroll',dx:Math.max(-2000,Math.min(2000,event.deltaX)),dy:Math.max(-2000,Math.min(2000,event.deltaY))});},{passive:false});
</script></body></html>
