name: AgentZeroSpike
options:
  bundleIdPrefix: local.agentzero
  deploymentTarget:
    iOS: "17.0"
packages:
  AgentZeroIOS:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Agent Zero
    CURRENT_PROJECT_VERSION: "9"
    MARKETING_VERSION: "0.1.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  AgentZeroSpike:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terminallylazy.a0-ios
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Dictate messages on this device. Audio is not uploaded; text is sent only when you tap Send.
        NSSpeechRecognitionUsageDescription: Transcribe speech on this device to an editable draft. Recognition is unavailable when on-device speech is unsupported.
        NSCameraUsageDescription: Scan your Agent Zero server QR code to fill its address. Camera images are not saved or uploaded.
    sources:
      - App
      - path: Tests/A0CoreTests/Fixtures/full.json
        buildPhase: resources
    dependencies:
      - package: AgentZeroIOS
        product: A0Core
      - package: AgentZeroIOS
        product: A0Realtime
      - package: AgentZeroIOS
        product: A0GenerativeUI
  A0UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/A0UITests
    dependencies:
      - target: AgentZeroSpike
  A0DeviceAcceptanceTests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/DeviceAcceptanceTests
    dependencies:
      - target: AgentZeroSpike
schemes:
  AgentZeroSpike:
    build:
      targets:
        AgentZeroSpike: all
    test:
      targets:
        - A0UITests
  AgentZeroDeviceAcceptance:
    build:
      targets:
        AgentZeroSpike: all
    test:
      targets:
        - A0DeviceAcceptanceTests
